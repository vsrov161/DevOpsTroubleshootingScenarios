services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.php:/var/www/html/index.php
    depends_on:
      - app
    networks:
      - webnet

  app:
    build:
      context: .
      dockerfile: Dockerfile.php
    depends_on:
      - db
    volumes:
      - ./index.php:/var/www/html/index.php
    networks:
      - webnet

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: test_db
    # БАГ 4: Отсутствие healthcheck (Race condition)
    
    networks:
      - webnet

networks:
  webnet: